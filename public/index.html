<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Gym जाओ — Workout Music Player</title>
  <meta name="description" content="Gym जाओ — a dark, minimal gym music player for your workout playlist." />

  <!-- Fonts: Poppins for body/player UI text. Baloo 2 (ExtraBold 800)
       for the header title only — a bold, rounded display face that
       natively covers both Latin and Devanagari in one unified design,
       so "Gym" and "जाओ" render as one logo/wordmark instead of two
       stitched-together typefaces. Only weight 800 is loaded since
       that's the exact weight the title uses — see .site-title in
       style.css to change it later.
       Falls back to system-ui if offline, so the site still works without network. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&family=Baloo+2:wght@800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Full-screen background image + dark overlay -->
  <div class="bg-layer" aria-hidden="true"></div>
  <div class="bg-overlay" aria-hidden="true"></div>

  <!-- Minimal transparent header -->
  <header class="site-header">
    <h1 class="site-title"><span class="lang-en">Gym</span> <span class="lang-hi">जाओ</span></h1>
    <p class="site-subtitle">WORKOUT&nbsp;•&nbsp;MUSIC&nbsp;•&nbsp;ENERGY</p>
  </header>

  <!-- Compact music player, docked at the bottom -->
  <main class="player-stage">
    <section class="player-card" id="playerCard" aria-label="Music player">

      <!-- Line 1: thumbnail, title/status, progress + time, playlist toggle -->
      <div class="pc-line pc-line-info">
        <div class="album-art" id="albumArt">
          <img id="albumImg" class="album-img" alt="" />
          <div class="equalizer" id="equalizer" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
        </div>

        <div class="track-info">
          <h2 class="song-title" id="songTitle">Loading playlist…</h2>
          <p class="song-status" id="songStatus">Tap play to start</p>
        </div>

        <div class="progress-group">
          <span class="time current" id="currentTime">0:00</span>
          <div class="progress-track" id="progressTrack">
            <div class="progress-fill" id="progressFill"></div>
            <div class="progress-handle" id="progressHandle"></div>
          </div>
          <span class="time duration" id="durationTime">0:00</span>
        </div>

        <button class="playlist-toggle" id="playlistToggle" aria-label="Open playlist" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="4" y1="6" x2="20" y2="6"></line>
            <line x1="4" y1="12" x2="20" y2="12"></line>
            <line x1="4" y1="18" x2="14" y2="18"></line>
          </svg>
        </button>
      </div>

      <!-- Line 2: transport controls + volume -->
      <div class="pc-line pc-line-controls">
        <button class="ctrl-btn ctrl-small" id="shuffleBtn" aria-label="Shuffle" aria-pressed="false" title="Shuffle">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line>
            <polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line>
          </svg>
        </button>

        <button class="ctrl-btn" id="prevBtn" aria-label="Previous song" title="Previous">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"></path></svg>
        </button>

        <button class="ctrl-btn ctrl-play" id="playBtn" aria-label="Play" title="Play">
          <svg id="iconPlay" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>
          <svg id="iconPause" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" style="display:none"><path d="M7 5h4v14H7zM13 5h4v14h-4z"></path></svg>
        </button>

        <button class="ctrl-btn" id="nextBtn" aria-label="Next song" title="Next">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor"><path d="M16 6h2v12h-2zM4.5 18l8.5-6-8.5-6z"></path></svg>
        </button>

        <button class="ctrl-btn ctrl-small" id="repeatBtn" aria-label="Repeat playlist" aria-pressed="false" title="Repeat">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
            <polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
          </svg>
        </button>

        <span class="ctrl-spacer"></span>

        <button class="volume-icon" id="muteBtn" aria-label="Mute">
          <svg id="iconVolHigh" viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M3 10v4h4l5 5V5L7 10H3z"></path><path d="M16.5 12a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"></path></svg>
          <svg id="iconVolMute" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" style="display:none"><path d="M3 10v4h4l5 5V5L7 10H3z"></path><path d="M19 8l-4 4m0-4l4 4" stroke="currentColor" stroke-width="2"></path></svg>
        </button>
        <input type="range" id="volumeSlider" class="volume-slider" min="0" max="100" value="70" aria-label="Volume" />
      </div>

    </section>

    <!-- Hidden YouTube player: kept off-screen, not display:none, so playback keeps running -->
    <div class="yt-holder" aria-hidden="true">
      <div id="ytPlayer"></div>
    </div>
  </main>

  <!-- Bottom-center credit line -->
  <p class="site-credit">Made with <span aria-hidden="true">❤️</span> Suryavanshi Studios</p>

  <!-- Playlist drawer / panel -->
  <div class="playlist-overlay" id="playlistOverlay"></div>
  <aside class="playlist-panel" id="playlistPanel" aria-label="Playlist" aria-hidden="true">
    <div class="playlist-header">
      <h3>Playlist</h3>
      <button class="playlist-close" id="playlistClose" aria-label="Close playlist">&times;</button>
    </div>
    <ul class="playlist-list" id="playlistList">
      <li class="playlist-empty">Loading tracks…</li>
    </ul>
  </aside>

  <!-- YouTube IFrame Player API -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="js/player.js"></script>
</body>
</html>
